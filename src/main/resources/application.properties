spring.application.name=ds-backend

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Server Configuration
server.port=${SERVER_PORT:9090}
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ds-backend}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Only enable these in development
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

# JWT Configuration
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION:3600000}
app.jwtIssuer=${JWT_ISSUER:ds-backend}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET

# Spring Data REST Configuration
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=annotated

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# SSL Configuration (enable in production)
#server.ssl.enabled=true
#server.ssl.protocol=TLS
#server.ssl.enabled-protocols=TLSv1.3
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store=${SSL_KEYSTORE_PATH}
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# Rate Limiting
spring.security.filter.rate-limit.enabled=true
spring.security.filter.rate-limit.requests-per-second=10

logging.level.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.web.authentication=DEBUG
logging.level.org.springframework.security.web.authentication.UsernamePasswordAuthenticationFilter=DEBUG
logging.level.org.springframework.security.web.authentication.logout=DEBUG
logging.level.org.springframework.security.web.authentication.logout.LogoutFilter=DEBUG
logging.level.org.springframework.security.web.authentication.logout.SecurityContextLogoutHandler=DEBUG
logging.level.org.springframework.security.web.authentication.logout.SimpleUrlLogoutSuccessHandler=DEBUG
logging.level.org.springframework.security.web.authentication.logout.LogoutSuccessHandler=DEBUG
logging.level.org.springframework.security.web.authentication.logout.LogoutSuccessEvent=DEBUG
logging.level.org.springframework.security.web.authentication.logout.LogoutHandler=DEBUG
logging.level.org.springframework.security.web.authentication.logout.LogoutEvent=DEBUG

spring.thymeleaf.check-template-location=false



